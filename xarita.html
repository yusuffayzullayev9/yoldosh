<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one-screen phone app. Real OpenStreetMap on top, bottom sheet for the order, district switcher in the header. */
:root{
  --bg:#E7ECF2; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#0F1B2D; --muted:#5A6779; --line:#DAE1EA;
  --accent:#1C6FE8; --accent-ink:#FFFFFF; --accent-soft:#E2EDFD; --accent-deep:#0B4FB8;
  --go:#18885A; --danger:#C23B3B; --shadow:rgba(15,27,45,.16);
  --plate-bg:#FFFFFF; --plate-ink:#111111; --flag-b:#1EB3E3; --flag-g:#1EA35A; --flag-r:#CE1126;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B111A; --surface:#121A26; --surface-2:#1A2432; --ink:#E6EDF6; --muted:#93A1B4; --line:#263244;
    --accent:#3D8BFA; --accent-ink:#FFFFFF; --accent-soft:#16294A; --accent-deep:#8FBAFF;
    --go:#34B07A; --danger:#E46A6A; --shadow:rgba(0,0,0,.5); --plate-bg:#ECEEE9;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line);overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;flex-direction:column;gap:8px;padding:9px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface);z-index:600;position:relative}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:17px}
.logo-mark{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted)}
.hbtn{border:0;border-radius:999px;padding:7px 12px;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:var(--surface-2);gap:3px}
.seg button{border:0;border-radius:9px;padding:7px 4px;background:none;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}

.map-wrap{flex:1 1 auto;min-height:220px;position:relative;z-index:0}
#map{position:absolute;inset:0;background:#e5e3df}
.badge{position:absolute;z-index:450;top:10px;left:12px;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:0 2px 10px var(--shadow);font-size:12px;font-weight:600;max-width:calc(100% - 80px)}
.live-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--go)}
.locbtn{position:absolute;z-index:450;right:12px;bottom:32px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 2px 10px var(--shadow);display:grid;place-items:center;color:var(--accent-deep)}
.locbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.toast{position:absolute;z-index:460;top:50px;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{flex:0 0 auto;max-height:58%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;margin-top:-20px;position:relative;z-index:500;box-shadow:0 -6px 22px var(--shadow)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-in{display:flex;flex-direction:column;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
h2{font-family:var(--font-display);font-weight:600;font-size:18.5px;line-height:1.2;margin:0}
.status{display:flex;flex-direction:column;gap:4px}
.status.center{align-items:center;text-align:center}
.status p,.hint{margin:0;color:var(--muted);font-size:13.5px}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.trip{border:1px solid var(--line);border-radius:16px}
.pt{display:flex;align-items:center;gap:12px;padding:11px 14px;min-width:0}
.pt + .pt{border-top:1px solid var(--line)}
.pt > div{flex:1;min-width:0}
.pt small{display:block;font-size:11.5px;color:var(--muted)}
.pt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt b.ph{color:var(--muted);font-weight:500}
.mk{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.mk.a{background:var(--ink);color:var(--surface)}
.mk.b{background:var(--accent);color:var(--accent-ink)}
.dist{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tariffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tariff{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.tariff.on{border-color:var(--accent);background:var(--accent-soft)}
.tn{font-size:13px;font-weight:600}
.tp{font-family:var(--font-display);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm{font-size:11px;color:var(--muted);line-height:1.3}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-weight:600}
.btn.ghost.danger{color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;flex-wrap:wrap}
.ava{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px}
.dinfo{flex:1;min-width:120px;display:flex;flex-direction:column}
.dinfo span{font-size:13px;color:var(--muted)}
.dinfo .tel{color:var(--ink);font-weight:600;user-select:all}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--plate-ink);border-radius:5px;background:var(--plate-bg);color:var(--plate-ink);font-weight:700;font-size:13px;line-height:1;white-space:nowrap}
.plate .reg{padding:5px;border-right:1.5px solid var(--plate-ink)}
.plate .pn{padding:5px 6px}
.plate .uz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 4px;font-size:7px}
.plate .uz i{display:block;width:12px;height:8px;background:linear-gradient(var(--flag-b) 0 32%,var(--flag-r) 32% 36%,var(--plate-bg) 36% 64%,var(--flag-r) 64% 68%,var(--flag-g) 68%)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted)}
.sum b{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s linear}
.radar{position:relative;width:88px;height:88px;display:grid;place-items:center;margin:4px auto}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2s ease-out infinite;opacity:0}
.radar i + i{animation-delay:1s}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.radar span{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.big-price{font-family:var(--font-display);font-weight:700;font-size:30px}
.stars{display:flex;gap:6px;justify-content:center}
.star{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:2px}
.star.on{color:var(--accent)}
.modal{position:absolute;inset:0;z-index:900;background:var(--surface);overflow-y:auto;padding:0 16px 24px}
.mhead{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.x{width:36px;height:36px;border:0;border-radius:50%;background:var(--surface-2);font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px}
th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 8px;background:var(--surface-2)}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}

/* qidiruv */
.search{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.qclear{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:22px;line-height:1}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:800;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);max-height:300px;overflow-y:auto}
.res{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.res:last-child{border-bottom:0}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res b{font-weight:600}
.res span{font-size:12px;color:var(--muted)}
.res-note{padding:12px 14px;font-size:13px;color:var(--muted)}
/* xarita belgilari */
.car-ic{background:none;border:0}
.car{width:26px;height:26px;display:grid;place-items:center;transition:transform .2s linear}
.car svg{width:16px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.car.mine svg{width:20px;height:32px}
.pin-ic{background:none;border:0}
.pin{width:30px;height:40px;position:relative}
.pin b{position:absolute;left:3px;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font-body);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin::after{content:"";position:absolute;left:11px;top:22px;border:4px solid transparent;border-top:9px solid var(--c)}
.pin.a{--c:#0F1B2D}.pin.a b{background:#0F1B2D;color:#fff}
.pin.b{--c:#1C6FE8}.pin.b b{background:#1C6FE8;color:#fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1C6FE8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(28,111,232,.25)}
@media (prefers-reduced-motion: reduce){.radar i{animation:none;opacity:.5}.car,.toast,.prog i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><span class="logo-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span><div>Yo‘ldosh<small>Shahrisabz · Kitob · Yakkabog‘</small></div></div>
      <span style="display:flex;gap:6px"><a class="hbtn" href="index.html" style="text-decoration:none">Barcha xizmatlar</a><button class="hbtn" id="pricesBtn">Narxlar</button></span>
    </div>
    <div class="search" id="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Qayerga borasiz? Masalan: bozor" autocomplete="off" enterkeyhint="search" aria-label="Qayerga">
      <button class="qclear" id="qClear" aria-label="Tozalash" hidden>×</button>
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <div class="map-wrap">
    <div id="map" aria-label="Xarita"></div>
    <div class="badge"><span class="live-dot"></span><span id="badgeTxt">Xarita yuklanmoqda…</span></div>
    <button class="locbtn" id="locBtn" aria-label="Joyimni aniqlash"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <section class="sheet" id="sheet" aria-live="polite"></section>
  <div class="modal" id="prices" hidden role="dialog" aria-modal="true"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
function problem(m) { toast(m); }
/* ---------- Xizmat hududi: uchta tuman bitta xaritada ---------- */
const TOWNS = [
  { name: "Shahrisabz", c: [39.0500, 66.8330] },
  { name: "Kitob",      c: [39.1336, 66.8819] },
  { name: "Yakkabog‘",  c: [38.9800, 66.6800] }
];
const AREA = [66.60, 39.20, 66.96, 38.92];            // chap, yuqori, o'ng, past
const nearestTown = p => TOWNS.reduce((a, t) => hav(p, t.c) < hav(p, a.c) ? t : a, TOWNS[0]);
const TAXI_T = [
  { id: "eko", name: "Ekonom", cars: "Cobalt, Nexia", base: 7000, perKm: 1500, min: 8000 },
  { id: "kom", name: "Komfort", cars: "Gentra, Malibu", base: 9000, perKm: 2000, min: 11000 },
  { id: "min", name: "Miniven", cars: "6 o‘rindiqli", base: 12000, perKm: 2500, min: 15000 }
];
const DRIVERS = [
  ["Aziz Rahimov","Cobalt","oq","70 A 125 KA",4.9,"+998 90 512 34 18"],
  ["Dilshod Tursunov","Nexia 3","kumush","70 B 318 MA",4.8,"+998 91 207 66 41"],
  ["Sherzod Aliyev","Gentra","qora","70 A 742 BC",4.95,"+998 93 470 12 05"],
  ["Bekzod Qodirov","Cobalt","oq","70 C 509 DA",4.7,"+998 94 318 90 22"],
  ["Ulug‘bek Sobirov","Lacetti","kulrang","70 A 066 RA",4.85,"+998 99 641 25 37"],
  ["Otabek Yo‘ldoshev","Cobalt","ko‘k","70 B 884 KA",4.75,"+998 97 185 03 64"],
  ["Javlon Rahmatov","Nexia 3","oq","70 A 318 TA",4.8,"+998 90 641 07 22"],
  ["Sardor Ergashev","Cobalt","kumush","70 C 225 BA",4.9,"+998 91 330 58 14"],
  ["Mirzo Toshpo‘latov","Gentra","oq","70 B 607 MA",4.85,"+998 93 218 44 70"],
  ["Rustam Normatov","Spark","qizil","70 A 904 KA",4.7,"+998 94 502 13 66"],
  ["Shohruh Qurbonov","Cobalt","oq","70 D 133 RA",4.9,"+998 97 711 28 05"],
  ["Anvar Xolmatov","Malibu","qora","70 A 551 AA",4.95,"+998 99 460 92 31"]
];
const KMH = 27;
const round500 = n => Math.round(n / 500) * 500;
const price = (t, m) => Math.max(t.min, round500(t.base + t.perKm * m / 1000));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so‘m";
const etaMin = m => Math.max(1, Math.round(m / 1000 / KMH * 60));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Geo yordamchilar ---------- */
const R_EARTH = 6371000, rad = x => x * Math.PI / 180;
function hav(a, b) {
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
function bearing(a, b) { return Math.atan2((b[1] - a[1]) * Math.cos(rad(a[0])), b[0] - a[0]) * 180 / Math.PI; }
function offset(c, meters, angDeg) {
  const dLat = meters * Math.cos(rad(angDeg)) / 111320, dLng = meters * Math.sin(rad(angDeg)) / (111320 * Math.cos(rad(c[0])));
  return [c[0] + dLat, c[1] + dLng];
}
function mkRoute(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + hav(pts[i - 1], pts[i]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function posAt(r, s) {
  if (r.pts.length < 2) return { p: r.pts[0], ang: 0 };
  let i = 1; while (i < r.pts.length - 1 && r.cum[i] < s) i++;
  const a = r.pts[i - 1], b = r.pts[i], seg = r.cum[i] - r.cum[i - 1] || 1, k = Math.min(1, Math.max(0, (s - r.cum[i - 1]) / seg));
  return { p: [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k], ang: bearing(a, b) };
}

/* ---------- Tashqi xizmatlar (navbat bilan, ehtiyotkorlik bilan) ---------- */
let qp = Promise.resolve();
function queued(fn) { const p = qp.then(() => new Promise(r => setTimeout(r, 350))).then(fn); qp = p.catch(() => {}); return p; }
const OSRM = "https://router.project-osrm.org";
async function osrmRoute(a, b) {
  return queued(async () => {
    try {
      const r = await fetch(`${OSRM}/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (!j.routes || !j.routes[0]) throw 0;
      return mkRoute(j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]));
    } catch (e) {                              // yo'l xizmati javob bermasa, to'g'ri chiziq
      const rt = mkRoute([a, b]); rt.len *= 1.3; rt.approx = true; return rt;
    }
  });
}
async function osrmNearest(p) {
  return queued(async () => {
    try { const r = await fetch(`${OSRM}/nearest/v1/driving/${p[1]},${p[0]}`); const j = await r.json(); const l = j.waypoints[0].location; return [l[1], l[0]]; }
    catch (e) { return p; }
  });
}
async function placeName(p) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p[0]}&lon=${p[1]}&zoom=17&accept-language=uz`);
    const j = await r.json(), a = j.address || {};
    return j.name || a.road || a.neighbourhood || a.suburb || a.village || a.town || a.city || "Xaritada belgilangan joy";
  } catch (e) { return "Xaritada belgilangan joy"; }
}
const KIND = { bus_station: "Avtovokzal", marketplace: "Bozor", hospital: "Shifoxona", townhall: "Hokimiyat", college: "Kollej", university: "Universitet", supermarket: "Supermarket", park: "Bog‘", historic: "Tarixiy joy", school: "Maktab" };
const KIND_ORDER = ["bus_station", "marketplace", "hospital", "townhall", "historic", "park", "supermarket", "college", "university"];
const PLACE_CATS = [["marketplace","marketplace"],["hospital","hospital"],["bus station","bus_station"],["townhall","townhall"],["supermarket","supermarket"],["park","park"],["college","college"],["school","school"]];
async function loadPlaces(onUpdate) {
  const vb = AREA.join(","), seen = new Set(), out = [];
  for (const [q, kind] of PLACE_CATS) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${vb}&bounded=1&limit=6&accept-language=uz`, { signal: ctl.signal });
      clearTimeout(t);
      const j = await r.json();
      for (const e of j) {
        const name = e.name || KIND[kind], key = name.toLowerCase();
        if (seen.has(key)) continue; seen.add(key);
        const p = [+e.lat, +e.lon];
        out.push({ name, kind, p, town: nearestTown(p).name });
      }
      if (onUpdate && out.length) onUpdate(out.slice(0, 18));
    } catch (e) {}
    await new Promise(r => setTimeout(r, 1100));          // Nominatim: soniyasiga 1 so'rov
  }
  return out.slice(0, 18);
}
async function searchPlaces(q, signal) {
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${AREA.join(",")}&bounded=1&limit=8&accept-language=uz`, { signal });
  const j = await r.json();
  return j.map(e => { const p = [+e.lat, +e.lon], parts = e.display_name.split(","); return { name: e.name || parts[0], sub: parts.slice(1, 2).join(",").trim(), p, town: nearestTown(p).name }; });
}

/* ---------- Xarita ---------- */
const map = L.map("map", { zoomControl: false, attributionControl: true });
L.control.zoom({ position: "topright" }).addTo(map);
/* Xarita rasmlari: CARTO (OpenStreetMap asosida). Ishlamasa, avtomatik Esri'ga o'tadi. */
const TILE_SOURCES = [
  { url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", opt: { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' } },
  { url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", opt: { maxZoom: 19, attribution: "Tiles &copy; Esri" } },
  { url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", opt: { subdomains: "abc", maxZoom: 17, attribution: '&copy; OpenStreetMap, OpenTopoMap' } }
];
let tileIdx = 0, tileErr = 0, tileOk = 0, tiles = null;
function useTiles(i) {
  if (tiles) map.removeLayer(tiles);
  tileIdx = i; tileErr = 0; tileOk = 0;
  tiles = L.tileLayer(TILE_SOURCES[i].url, TILE_SOURCES[i].opt).addTo(map);
  tiles.on("tileload", () => { tileOk++; });
  tiles.on("tileerror", () => {
    tileErr++;
    if (tileErr > 6 && tileOk === 0) {
      if (tileIdx + 1 < TILE_SOURCES.length) useTiles(tileIdx + 1);
      else problem("Xarita rasmlari yuklanmadi. Internet ulanganini tekshiring.");
    }
  });
}
useTiles(0);
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
const CAR_SVG = c => `<svg viewBox="0 0 16 26"><rect x="1" y="1" width="14" height="24" rx="5" fill="${c}" stroke="#fff" stroke-width="1.5"/><rect x="3.5" y="6" width="9" height="5" rx="1.5" fill="rgba(0,0,0,.4)"/><rect x="3.5" y="17" width="9" height="4" rx="1.2" fill="rgba(0,0,0,.25)"/></svg>`;
const carIcon = mine => L.divIcon({ className: "car-ic", html: `<div class="car${mine ? " mine" : ""}">${CAR_SVG(mine ? "#0F1B2D" : "#1C6FE8")}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
const pinIcon = t => L.divIcon({ className: "pin-ic", html: `<div class="pin ${t.toLowerCase()}"><b>${t}</b></div>`, iconSize: [30, 40], iconAnchor: [15, 38] });
const meIcon = L.divIcon({ className: "pin-ic", html: `<div class="me-dot"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] });

/* ---------- Holat ---------- */
const S = { A: null, Aname: "", gps: null, B: null, Bname: "", plan: null, tariff: "eko",
  stage: "select", car: null, price: 0, tok: 0, showPhone: false, rating: 0, places: [] };
let markA = null, markB = null, markMe = null, planLine = null, liveLine = null;
let cars = [];

/* ---------- Soxta taksilar (haqiqiy ko'chalar bo'ylab yuradi) ---------- */
function clearCars() { cars.forEach(c => map.removeLayer(c.m)); cars = []; }
async function spawnCars() {
  clearCars();
  for (let i = 0; i < DRIVERS.length; i++) {
    const town = TOWNS[i % TOWNS.length];
    const p = await osrmNearest(offset(town.c, 300 + Math.random() * 1400, Math.random() * 360));
    const r = DRIVERS[i];
    const car = { name: r[0], model: r[1], color: r[2], plate: r[3], rating: r[4], phone: r[5], town, pos: p, ang: 0, route: null, s: 0, speed: 10, free: true, onArrive: null, wait: 1 + Math.random() * 4 };
    car.m = L.marker(p, { icon: carIcon(false), interactive: false, keyboard: false }).addTo(map);
    cars.push(car);
    if (i % 3 === 2) badge();
  }
  badge();
  if (S.stage === "select") render();
}
async function wander(car) {
  car.pending = true;
  const dest = offset(car.town.c, 200 + Math.random() * 1500, Math.random() * 360);
  const r = await osrmRoute(car.pos, dest);
  car.pending = false;
  if (!car.free || car.route || !cars.includes(car)) return;
  if (r.approx) { car.wait = 20; return; }   // yo'l xizmati ishlamasa, turgan joyida qoladi
  car.route = r; car.s = 0; car.speed = 9 + Math.random() * 4;
}
function driveAlong(car, route, speed, cb) { car.route = route; car.s = 0; car.speed = speed; car.onArrive = cb; }
function setCarIcon(car) {
  car.m.setLatLng(car.pos);
  const el = car.m.getElement(); if (el && el.firstChild) el.firstChild.style.transform = `rotate(${car.ang}deg)`;
}
let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  for (const car of cars) {
    if (car.route) {
      car.s += car.speed * dt;
      const at = posAt(car.route, Math.min(car.s, car.route.len));
      car.pos = at.p; car.ang = at.ang;
      if (car.s >= car.route.len) {
        car.route = null;
        const cb = car.onArrive; car.onArrive = null;
        if (cb) cb(); else car.wait = 2 + Math.random() * 6;
      }
      setCarIcon(car);
    } else if (car.free && !car.pending) {
      car.wait -= dt; if (car.wait <= 0) wander(car);
    }
  }
  if (S.car && S.car.route && liveLine) {
    const r = S.car.route, i = r.cum.findIndex(x => x >= S.car.s);
    liveLine.setLatLngs([S.car.pos, ...r.pts.slice(Math.max(1, i))]);
  }
  requestAnimationFrame(tick);
}
const remM = car => car.route ? Math.max(0, car.route.len - car.s) : 0;
function nearestFree(p) { let best = null, bd = Infinity; for (const c of cars) if (c.free) { const x = hav(c.pos, p); if (x < bd) { bd = x; best = c; } } return best; }

/* ---------- Nuqtalar ---------- */
function setA(p, name) {
  S.A = p; S.Aname = name || S.Aname;
  if (!markA) markA = L.marker(p, { icon: pinIcon("A"), draggable: true, zIndexOffset: 900 }).addTo(map).on("dragend", e => { const ll = e.target.getLatLng(); setA([ll.lat, ll.lng], "…"); placeName(S.A).then(n => { S.Aname = n; render(); }); });
  else markA.setLatLng(p);
  replan();
}
function setB(p, name) {
  S.B = p; S.Bname = name || "…";
  if (!markB) markB = L.marker(p, { icon: pinIcon("B"), zIndexOffset: 900 }).addTo(map); else markB.setLatLng(p);
  if (!name) placeName(p).then(n => { if (S.B === p) { S.Bname = n; render(); } });
  replan();
}
async function replan() {
  if (!S.A || !S.B) { render(); return; }
  const a = S.A, b = S.B; S.plan = null; render();
  const r = await osrmRoute(a, b);
  if (S.A !== a || S.B !== b) return;
  S.plan = r;
  if (planLine) map.removeLayer(planLine);
  planLine = L.polyline(r.pts, { color: "#0F1B2D", weight: 4, opacity: .75, dashArray: r.approx ? "6 8" : null }).addTo(map);
  render(); map.invalidateSize();
  map.fitBounds(L.latLngBounds(r.pts).pad(0.25), { maxZoom: 16 });
}
function clearTrip() {
  [markB, planLine, liveLine].forEach(l => l && map.removeLayer(l));
  markB = planLine = liveLine = null; S.B = null; S.plan = null;
}

/* ---------- Boshlash: uchala tuman birga ---------- */
async function start() {
  setA(TOWNS[0].c, "Shahrisabz markazi");
  S.places = []; S.placesState = "loading"; render();
  map.invalidateSize(); map.fitBounds(L.latLngBounds(TOWNS.map(t => t.c)).pad(0.15));
  spawnCars();
  const pl = await loadPlaces(part => { S.places = part; if (S.stage === "select") render(); });
  S.places = pl; S.placesState = "done"; if (S.stage === "select") render();
}

/* ---------- GPS ---------- */
function locate(manual) {
  if (!navigator.geolocation) { if (manual) toast("Bu qurilmada joylashuvni aniqlab bo‘lmadi"); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const p = [pos.coords.latitude, pos.coords.longitude];
    S.gps = p;
    if (!markMe) markMe = L.marker(p, { icon: meIcon, interactive: false }).addTo(map); else markMe.setLatLng(p);
    if (hav(p, nearestTown(p).c) > 15000) { if (manual) toast("Siz xizmat hududidan tashqaridasiz. A nuqtani xaritada suring"); return; }
    if (S.stage === "select") { setA(p, "Siz turgan joy"); map.setView(p, 15); }
  }, () => { if (manual) toast("Joylashuvga ruxsat berilmadi. A nuqtani xaritada suring"); }, { enableHighAccuracy: true, timeout: 10000 });
}

/* ---------- UI ---------- */
const sheet = document.getElementById("sheet"), toastEl = document.getElementById("toast");
let toastT; function toast(m) { toastEl.textContent = m; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2600); }
function badge() {
  const free = cars.filter(c => c.free).length;
  document.getElementById("badgeTxt").textContent = `3 tuman · ${free} ta bo‘sh taksi (namuna)`;
}
const initials = n => n.split(" ").map(w => w[0]).join("").slice(0, 2);
const plate = p => { const [reg, ...rest] = p.split(" "); return `<span class="plate"><span class="reg">${reg}</span><span class="pn">${rest.join(" ")}</span><span class="uz"><i></i>UZ</span></span>`; };
const dcard = (c, phone) => `<div class="dcard"><div class="ava">${initials(c.name)}</div><div class="dinfo"><b>${esc(c.name)}</b><span>${c.model}, ${c.color} · ★ ${c.rating}</span>${phone ? `<span class="tel">${c.phone}</span>` : ""}</div>${plate(c.plate)}</div>`;

function render() {
  const t = TAXI_T.find(x => x.id === S.tariff);
  let h = "";
  if (S.stage === "select") {
    const m = S.plan ? S.plan.len : 0, car = S.A && nearestFree(S.A);
    const carEta = car ? `≈${etaMin(hav(car.pos, S.A) * 1.3)} daq. yetadi` : "…";
    h = `
      <div class="trip">
        <div class="pt"><span class="mk a">A</span><div><small>Qayerdan · pin‘ni surib aniqlang</small><b>${esc(S.Aname || "…")}</b></div></div>
        <div class="pt"><span class="mk b">B</span><div><small>Qayerga</small><b class="${S.B ? "" : "ph"}">${S.B ? esc(S.Bname) : "Tepada yozing, xaritaga bosing yoki pastdan tanlang"}</b></div>${S.B ? `<span class="dist">${S.plan ? (m / 1000).toFixed(1) + " km" : "…"}</span>` : ""}</div>
      </div>
      <div class="chips">${S.places.length ? S.places.map((p, i) => `<button class="chip" data-act="place" data-i="${i}">${esc(p.name)}<small>${p.name === KIND[p.kind] ? p.town : KIND[p.kind] + " · " + p.town}</small></button>`).join("") : `<span class="hint">${S.placesState === "loading" ? "Mashhur joylar yuklanmoqda…" : "Mashhur joylar topilmadi. B nuqtani xaritaga bosib belgilang."}</span>`}</div>
      ${S.plan && S.plan.approx ? `<p class="hint">Yo‘l xizmati javob bermadi, masofa taxminiy hisoblandi.</p>` : ""}
      <div class="tariffs">${TAXI_T.map(x => `<button class="tariff ${S.tariff === x.id ? "on" : ""}" data-act="tariff" data-id="${x.id}"><span class="tn">${x.name}</span><span class="tp">${S.plan ? fmt(price(x, m)) : fmt(x.min) + "dan"}</span><span class="tm">${x.cars}<br>${carEta}</span></button>`).join("")}</div>
      <button class="btn" data-act="call" ${S.plan ? "" : "disabled"}>Taksi chaqirish${S.plan ? " · " + fmt(price(t, m)) : ""}</button>`;
  } else if (S.stage === "search") {
    h = `<div class="status center"><div class="radar"><i></i><i></i><span>A</span></div><h2>Haydovchi qidirilmoqda</h2><p>Yaqin atrofdagi bo‘sh taksilarga so‘rov yuborildi</p></div>
      <div class="sum"><span>${esc(S.Bname)} · ${t.name}</span><b>${fmt(S.price)}</b></div>
      <button class="btn ghost danger" data-act="cancel">Bekor qilish</button>`;
  } else if (S.stage === "coming") {
    h = `<div class="status"><h2>Haydovchi yo‘lda</h2><p><span class="num" id="eta">…</span> daqiqada yetib keladi</p></div>${dcard(S.car, S.showPhone)}
      <div class="row2"><button class="btn ghost" data-act="phone">${S.showPhone ? "Raqamni yashirish" : "Qo‘ng‘iroq"}</button><button class="btn ghost danger" data-act="cancel">Bekor qilish</button></div>
      <div class="sum"><span>${esc(S.Bname)} · ${t.name}</span><b>${fmt(S.price)}</b></div>`;
  } else if (S.stage === "arrived") {
    h = `<div class="status"><h2>Haydovchi yetib keldi</h2><p>${S.car.color.charAt(0).toUpperCase() + S.car.color.slice(1)} ${S.car.model} sizni kutyapti</p></div>${dcard(S.car, S.showPhone)}<button class="btn" data-act="sit">Mashinaga o‘tirdim</button>`;
  } else if (S.stage === "ride") {
    h = `<div class="status"><h2>Yo‘ldasiz</h2><p>${esc(S.Bname)}gacha <span class="num" id="eta">…</span> daqiqa</p></div><div class="prog"><i id="prog"></i></div>${dcard(S.car, false)}<div class="sum"><span>Narx o‘zgarmaydi</span><b>${fmt(S.price)}</b></div>`;
  } else {
    h = `<div class="status center"><h2>Yetib keldingiz</h2><p>${esc(S.Bname)} · ${S.car.name}</p><span class="big-price">${fmt(S.price)}</span></div>
      <div class="stars">${[1,2,3,4,5].map(i => `<button class="star ${S.rating >= i ? "on" : ""}" data-act="star" data-v="${i}" aria-label="${i} yulduz">★</button>`).join("")}</div>
      <button class="btn" data-act="new">Yangi buyurtma</button>`;
  }
  sheet.innerHTML = `<div class="grip"></div><div class="sheet-in">${h}</div>`;
  live();
}
function live() {
  badge();
  if (!S.car) return;
  const e = document.getElementById("eta"); if (e) e.textContent = etaMin(remM(S.car));
  const p = document.getElementById("prog"); if (p && S.plan) p.style.width = (100 * (1 - remM(S.car) / S.plan.len)).toFixed(1) + "%";
}

/* ---------- Buyurtma oqimi ---------- */
async function call() {
  const t = TAXI_T.find(x => x.id === S.tariff);
  S.price = price(t, S.plan.len); S.stage = "search"; S.rating = 0; S.showPhone = false;
  const tok = ++S.tok; render();
  await new Promise(r => setTimeout(r, 1800));
  if (S.tok !== tok) return;
  const car = nearestFree(S.A);
  if (!car) { S.stage = "select"; render(); toast("Hozir bo‘sh taksi yo‘q"); return; }
  car.free = false; car.route = null; car.onArrive = null; S.car = car;
  const r = await osrmRoute(car.pos, S.A);
  if (S.tok !== tok) { car.free = true; return; }
  S.stage = "coming"; render(); toast(`${car.name} buyurtmangizni qabul qildi`);
  car.m.setIcon(carIcon(true)); setCarIcon(car);
  if (liveLine) map.removeLayer(liveLine);
  liveLine = L.polyline(r.pts, { color: "#1C6FE8", weight: 5 }).addTo(map);
  driveAlong(car, r, 16, () => { if (S.tok !== tok) return; S.stage = "arrived"; render(); toast("Haydovchi yetib keldi"); });
}
function sit() {
  const tok = S.tok; S.stage = "ride"; render();
  if (planLine) { map.removeLayer(planLine); planLine = null; }
  driveAlong(S.car, S.plan, 14, () => { if (S.tok !== tok) return; S.stage = "done"; freeCar(S.car); render(); toast("Yetib keldingiz"); });
}
function freeCar(c) { c.free = true; c.onArrive = null; c.wait = 3; c.m.setIcon(carIcon(false)); setCarIcon(c); if (liveLine) { map.removeLayer(liveLine); liveLine = null; } }
function cancel() {
  S.tok++;
  if (S.car) { S.car.route = null; freeCar(S.car); S.car = null; }
  S.stage = "select"; render(); toast("Buyurtma bekor qilindi");
}

sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  switch (b.dataset.act) {
    case "place": { const p = S.places[+b.dataset.i]; setB(p.p, p.name); break; }
    case "tariff": S.tariff = b.dataset.id; render(); break;
    case "call": call(); break;
    case "cancel": cancel(); break;
    case "phone": S.showPhone = !S.showPhone; render(); break;
    case "sit": sit(); break;
    case "star": S.rating = +b.dataset.v; render(); break;
    case "new": clearTrip(); S.car = null; S.stage = "select"; render(); break;
  }
});
/* ---------- "Qayerga" qidiruvi ---------- */
const qEl = document.getElementById("q"), resEl = document.getElementById("results"), qClear = document.getElementById("qClear");
let qTimer = null, qCtl = null, qList = [];
function showResults(html) { resEl.innerHTML = html; resEl.hidden = !html; }
function drawResults(list, note) {
  qList = list;
  showResults(list.map((r, i) => `<button class="res" data-i="${i}"><b>${esc(r.name)}</b><span>${esc([r.kind ? KIND[r.kind] : r.sub, r.town].filter(Boolean).join(" · "))}</span></button>`).join("") + (note ? `<div class="res-note">${note}</div>` : ""));
}
qEl.addEventListener("input", () => {
  const q = qEl.value.trim(); qClear.hidden = !q;
  clearTimeout(qTimer); if (qCtl) qCtl.abort();
  if (q.length < 2) { showResults(""); return; }
  const low = q.toLowerCase();
  const local = S.places.filter(p => p.name.toLowerCase().includes(low) || (KIND[p.kind] || "").toLowerCase().includes(low) || p.town.toLowerCase().includes(low));
  drawResults(local, "Qidirilmoqda…");
  qTimer = setTimeout(async () => {
    qCtl = new AbortController();
    try {
      const found = await searchPlaces(q, qCtl.signal);
      const seen = new Set(local.map(p => p.name.toLowerCase()));
      const all = local.concat(found.filter(f => !seen.has(f.name.toLowerCase())));
      drawResults(all, all.length ? "" : "Hech narsa topilmadi. Boshqacha yozib ko‘ring yoki xaritaga bosing.");
    } catch (e) { if (e.name !== "AbortError") drawResults(local, local.length ? "" : "Qidiruv ishlamadi. Xaritaga bosib belgilang."); }
  }, 600);
});
qEl.addEventListener("focus", () => { if (qEl.value.trim().length >= 2) qEl.dispatchEvent(new Event("input")); });
resEl.addEventListener("click", e => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const r = qList[+b.dataset.i];
  if (S.stage !== "select") { toast("Avval joriy buyurtmani yakunlang yoki bekor qiling"); return; }
  setB(r.p, r.name); qEl.value = ""; qClear.hidden = true; showResults(""); qEl.blur();
});
qClear.addEventListener("click", () => { qEl.value = ""; qClear.hidden = true; showResults(""); qEl.focus(); });
document.addEventListener("click", e => { if (!e.target.closest("#search")) showResults(""); });
document.getElementById("locBtn").addEventListener("click", () => locate(true));
map.on("click", e => { if (S.stage === "select") setB([e.latlng.lat, e.latlng.lng]); });

const pricesEl = document.getElementById("prices");
document.getElementById("pricesBtn").addEventListener("click", () => {
  pricesEl.innerHTML = `<div class="mhead"><h2>Narxlar</h2><button class="x" data-close aria-label="Yopish">×</button></div>
    <table><thead><tr><th>Tarif</th><th>Chiqish</th><th>1 km</th><th>Eng kam</th></tr></thead><tbody>
    ${TAXI_T.map(t => `<tr><td><b>${t.name}</b><br><small>${t.cars}</small></td><td>${fmt(t.base)}</td><td>${fmt(t.perKm)}</td><td>${fmt(t.min)}</td></tr>`).join("")}</tbody></table>
    <p class="hint" style="margin-top:12px">Narxlar so‘mda. Safar narxi buyurtmadan oldin ko‘rinadi va yo‘lda o‘zgarmaydi. Masofa haqiqiy yo‘l bo‘yicha hisoblanadi.</p>`;
  pricesEl.hidden = false;
});
pricesEl.addEventListener("click", e => { if (e.target.closest("[data-close]")) pricesEl.hidden = true; });

/* ---------- Ishga tushirish ---------- */
start();
locate(false);
setInterval(live, 500);
requestAnimationFrame(t => { lastT = t; tick(t); });
})();
</script>
</body>
</html>

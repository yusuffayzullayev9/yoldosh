<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C6FE8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Yo‘ldosh Taksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one-screen phone app. Live town map on top, a bottom sheet for the current task, five service tabs at the bottom. */
:root{
  --bg:#E7ECF2; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#0F1B2D; --muted:#5A6779; --line:#DAE1EA;
  --accent:#1C6FE8; --accent-ink:#FFFFFF; --accent-soft:#E2EDFD; --accent-deep:#0B4FB8;
  --go:#18885A; --danger:#C23B3B; --cargo:#DB8A12; --courier:#0E9A8A; --on-route:#FFFFFF; --shadow:rgba(15,27,45,.14);
  --r1:#18885A; --r3:#D9541E; --r7:#9C3FA8;
  --plate-bg:#FFFFFF; --plate-ink:#111111; --flag-b:#1EB3E3; --flag-g:#1EA35A; --flag-r:#CE1126;
  --map-ground:#E4EAF0; --map-block:#D5DDE7; --map-bldg:#C5CFDC; --map-road:#FFFFFF; --map-edge:#BBC6D4;
  --map-main:#D5E5FB; --map-water:#A6C8EA; --map-park:#CDE2D0; --map-tree:#9AC6A1; --map-label:#33435A; --map-halo:#F2F5F9;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111A; --surface:#121A26; --surface-2:#1A2432; --ink:#E6EDF6; --muted:#93A1B4; --line:#263244;
    --accent:#3D8BFA; --accent-ink:#FFFFFF; --accent-soft:#16294A; --accent-deep:#8FBAFF;
    --go:#34B07A; --danger:#E46A6A; --cargo:#F0A93A; --courier:#2CC0AE; --on-route:#FFFFFF; --shadow:rgba(0,0,0,.5);
    --r1:#2E9E6A; --r3:#E8703F; --r7:#B862C4;
    --plate-bg:#ECEEE9; --plate-ink:#111111;
    --map-ground:#111924; --map-block:#172130; --map-bldg:#1F2A3B; --map-road:#2C3A4E; --map-edge:#0B1119;
    --map-main:#1E3657; --map-water:#183552; --map-park:#16301F; --map-tree:#234A31; --map-label:#AEBBCD; --map-halo:#111924;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111A; --surface:#121A26; --surface-2:#1A2432; --ink:#E6EDF6; --muted:#93A1B4; --line:#263244;
  --accent:#3D8BFA; --accent-ink:#FFFFFF; --accent-soft:#16294A; --accent-deep:#8FBAFF;
  --go:#34B07A; --danger:#E46A6A; --cargo:#F0A93A; --courier:#2CC0AE; --on-route:#FFFFFF; --shadow:rgba(0,0,0,.5);
  --r1:#2E9E6A; --r3:#E8703F; --r7:#B862C4;
  --plate-bg:#ECEEE9; --plate-ink:#111111;
  --map-ground:#111924; --map-block:#172130; --map-bldg:#1F2A3B; --map-road:#2C3A4E; --map-edge:#0B1119;
  --map-main:#1E3657; --map-water:#183552; --map-park:#16301F; --map-tree:#234A31; --map-label:#AEBBCD; --map-halo:#111924;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line);overflow:hidden;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:3}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;min-width:0}
.logo-mark{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.top-r{display:flex;align-items:center;gap:8px}
.hbtn{border:0;border-radius:999px;padding:7px 12px;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.hbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.demo{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}

.map-wrap{flex:1 1 auto;min-height:180px;position:relative;background:var(--map-ground)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:crosshair}
.badge{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:0 2px 10px var(--shadow);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.live-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--go);animation:live 1.8s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.toast{position:absolute;top:50px;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s;z-index:2}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{flex:0 0 auto;max-height:62%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;margin-top:-20px;position:relative;z-index:2;box-shadow:0 -6px 22px var(--shadow);overscroll-behavior:contain}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-in{display:flex;flex-direction:column;gap:12px;padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-block:5px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));position:relative;z-index:3}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:42px;height:28px;padding:3px 9px;border-radius:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{background:var(--accent-soft);color:var(--accent-deep)}

h2{font-family:var(--font-display);font-weight:600;font-size:18.5px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
.status p,.hint{margin:0;color:var(--muted);font-size:13.5px}
.status{display:flex;flex-direction:column;gap:4px}
.status.center{align-items:center;text-align:center}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--surface-2);gap:3px}
.seg button{border:0;border-radius:9px;padding:8px 6px;background:none;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}

.trip{border:1px solid var(--line);border-radius:16px}
.pt{display:flex;align-items:center;gap:12px;padding:11px 14px;min-width:0}
.pt + .pt{border-top:1px solid var(--line)}
.pt > div{flex:1;min-width:0}
.pt small{display:block;font-size:11.5px;color:var(--muted)}
.pt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt b.ph{color:var(--muted);font-weight:500}
.mk{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.mk.a{background:var(--ink);color:var(--surface)}
.mk.b{background:var(--accent);color:var(--accent-ink)}
.dist{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trip.compact .pt{padding:8px 12px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}

.tariffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tariff{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.tariff.on{border-color:var(--accent);background:var(--accent-soft)}
.tariff:disabled{opacity:.45;cursor:not-allowed}
.tn{font-size:13px;font-weight:600}
.tp{font-family:var(--font-display);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm{font-size:11px;color:var(--muted);line-height:1.3}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.hscroll .tariff{flex:0 0 122px}
.tic{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;margin-bottom:4px;color:var(--courier)}
.tic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15.5px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-weight:600}
.btn.ghost.danger{color:var(--danger)}
.btn.sm{min-height:40px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--accent-deep);font-weight:600;font-size:14px}

.dcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;flex-wrap:wrap}
.ava{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px}
.ava.c{background:color-mix(in srgb,var(--courier) 18%,var(--surface));color:var(--courier)}
.ava.g{background:color-mix(in srgb,var(--cargo) 20%,var(--surface));color:var(--cargo)}
.dinfo{flex:1;min-width:120px;display:flex;flex-direction:column}
.dinfo b{font-weight:600}
.dinfo span{font-size:13px;color:var(--muted)}
.dinfo .tel{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.tbadge{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--courier) 16%,var(--surface));color:var(--courier);white-space:nowrap}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--plate-ink);border-radius:5px;background:var(--plate-bg);color:var(--plate-ink);font-weight:700;font-size:13px;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.plate .reg{padding:5px 5px;border-right:1.5px solid var(--plate-ink)}
.plate .pn{padding:5px 6px}
.plate .uz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 4px;font-size:7px;letter-spacing:0}
.plate .uz i{display:block;width:12px;height:8px;background:linear-gradient(var(--flag-b) 0 32%,var(--flag-r) 32% 36%,var(--plate-bg) 36% 64%,var(--flag-r) 64% 68%,var(--flag-g) 68%)}

.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted)}
.sum b{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .35s linear}

.radar{position:relative;width:88px;height:88px;display:grid;place-items:center;margin:4px auto}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2s ease-out infinite;opacity:0}
.radar i + i{animation-delay:1s}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.radar span{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.radar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.big-price{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;justify-content:center}
.star{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:2px}
.star.on{color:var(--accent)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.code-box{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.code-box small{font-size:12.5px;color:var(--ink);max-width:22ch}
.code{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.18em;font-variant-numeric:tabular-nums;color:var(--accent-deep)}
.err{color:var(--danger);font-size:13px;font-weight:600;margin:0}

/* do'kon va menyu */
.stores{display:flex;flex-direction:column;gap:8px}
.store{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.sic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px}
.store b{display:block;font-weight:600}
.store span{font-size:12.5px;color:var(--muted);display:block}
.store .from{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.store .from b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.menu{list-style:none;margin:0;padding:0}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.menu li:last-child .mi{border-bottom:0}
.mi b{display:block;font-weight:600}
.mi span{font-size:12.5px;color:var(--muted)}
.mi .pr{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:2px;border-radius:999px;background:var(--surface-2)}
.step button{width:34px;height:34px;border:0;border-radius:50%;background:none;font-size:18px;font-weight:600;color:var(--accent-deep)}
.step b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.add{border:0;border-radius:999px;padding:8px 14px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:13px}
.cartbar{position:sticky;bottom:0;padding-top:4px;background:var(--surface)}
.bd{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.bd span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.bd .neg{color:var(--danger)}
.bd .tot{font-weight:700;border-top:1px dashed var(--line);padding-top:6px}
.bd .cap{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* yuk */
.vlist{display:flex;flex-direction:column;gap:8px}
.veh{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.veh.on{border-color:var(--accent);background:var(--accent-soft)}
.vic{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--cargo) 18%,var(--surface));color:var(--cargo);display:grid;place-items:center}
.vic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.veh b{display:block;font-weight:600}
.veh span{display:block;font-size:12px;color:var(--muted)}
.veh .vp{text-align:right}
.veh .vp b{font-family:var(--font-display);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.helpers{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.helpers small{display:block;font-size:12px;color:var(--muted)}

/* marshrut */
.rchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rchip{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:9px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.rchip.on{border-color:var(--rc)}
.rchip span:last-child{font-size:11.5px;color:var(--muted);line-height:1.25}
.rno{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:6px;background:var(--rc);color:var(--on-route);font-weight:700;font-size:12.5px}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);border-left:4px solid var(--rc)}
.next small{display:block;font-size:12px;color:var(--muted)}
.next b{display:block;font-weight:600}
.next .nx2{font-size:12.5px;color:var(--muted)}
.next .when{text-align:right;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.next .when small{font-family:var(--font-body);font-weight:500;font-size:12px;margin-top:4px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:11px;top:18px;bottom:18px;width:3px;border-radius:2px;background:var(--rc)}
.stop{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 2px 9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.stops li:last-child .stop{border-bottom:0}
.stop .node{justify-self:center;width:13px;height:13px;border-radius:50%;border:3px solid var(--rc);background:var(--surface);position:relative;z-index:1}
.stop.on .node{width:17px;height:17px;background:var(--rc)}
.stop .sn{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

let last = performance.now();

const initials = n => n.replace(/[«»"]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function plate(p) { const [reg, ...rest] = p.split(" "); return `<span class="plate" aria-label="Davlat raqami ${p}"><span class="reg">${reg}</span><span class="pn">${rest.join(" ")}</span><span class="uz"><i></i>UZ</span></span>`; }
function dcard(c, phone) {
  if (c.kind === "courier") return `<div class="dcard"><div class="ava c">${initials(c.name)}</div><div class="dinfo"><b>${esc(c.name)}</b><span>Kuryer · ★ ${c.rating}</span>${phone ? `<span class="tel">${c.phone}</span>` : ""}</div><span class="tbadge">${CT[c.type].name}</span></div>`;

}

    const u = o.to != null ? pdist(USER, o.to) : 0;
    return `
      <div class="trip">
        <div class="pt"><span class="mk a">A</span><div><small>Qayerdan</small><b>${NAMES[USER]} yonida · siz</b></div></div>

      </div>
      <div class="chips">${QUICK.map(n => `<button class="chip ${o.to === n ? "on" : ""}" data-act="dest" data-n="${n}">${NAMES[n]}</button>`).join("")}</div>

      <div class="status"><h2>Haydovchi yetib keldi</h2><p>${cap1(o.car.color)} ${o.car.model} sizni kutyapti</p></div>

  if (o.stage === "ride") return `

/* ================= Yetkazish: mijoz ================= */
const cartList = o => Object.entries(o.cart).filter(([, q]) => q > 0).map(([i, q]) => ({ i: +i, q, it: STORES[o.store].menu[+i] }));
const cartSum = o => cartList(o).reduce((s, x) => s + x.it[2] * x.q, 0);
const cartQty = o => cartList(o).reduce((s, x) => s + x.q, 0);
const cartKg = o => cartList(o).reduce((s, x) => s + x.it[3] * x.q, 0);
function transportCards(from, to, kg, prep) {
  const o = S.del, u = pdist(from, to);
  return `<div class="hscroll">${COUR_T.map(t => {
    const tooFar = km(u) > t.max, tooHeavy = kg > t.capKg, off = tooFar || tooHeavy;
    const c = nearestFree(couriers, from, x => x.type === t.id);
    const eta = c ? prep + mins(distTo(c, from), t.kmh) + mins(u, t.kmh) : null;
    const why = tooFar ? `${t.max} km gacha yuradi` : tooHeavy ? `${t.capKg} kg gacha oladi` : eta ? `≈${eta} daqiqa` : "Hozir band";
    return `<button class="tariff ${o.transport === t.id && !off ? "on" : ""}" data-act="transport" data-id="${t.id}" ${off || !c ? "disabled" : ""}><span class="tic">${vIcon(t.id)}</span><span class="tn">${t.name}</span><span class="tp">${fmt(courFee(t, u))}</span><span class="tm">${why}</span></button>`;
  }).join("")}</div>`;
}
function pickTransport(from, to, kg) {
  const o = S.del, u = pdist(from, to);
  const ok = t => km(u) <= t.max && kg <= t.capKg && nearestFree(couriers, from, x => x.type === t.id);
  if (!ok(CT[o.transport])) { const t = COUR_T.find(ok); if (t) o.transport = t.id; }
  return ok(CT[o.transport]);
}
function rDelClient() {

        ${ok ? `<div class="field"><span class="lbl">Kim olib boradi</span>${transportCards(o.from, o.to, kg, 2)}</div>` : `<p class="hint">Manzilni ro‘yxatdan tanlang yoki xaritaga bosing.</p>`}

      <p class="hint">${o.kind === "food" ? "Restoran va choyxonalar" : "Do‘kon va bozor rastalari"} · yetkazish narxi masofaga qarab, oldindan ko‘rinadi</p>
      <div class="stores">${list.map(s => {

  }
  if (o.stage === "store") {

    return `
      <button class="back" data-act="toBrowse">← Orqaga</button>
      <div class="status"><h2>${s.name}</h2><p>${s.tag} · ★ ${s.rating} · ${NAMES[s.node]}</p></div>
      <ul class="menu">${s.menu.map((m, i) => { const n = o.cart[i] || 0; return `<li class="mi"><div><b>${m[0]}</b><span>${m[1]} · <span class="pr">${fmt(m[2])}</span></span></div>${n ? `<div class="step"><button data-act="dec" data-v="${i}" aria-label="Kamaytirish">−</button><b>${n}</b><button data-act="inc" data-v="${i}" aria-label="Ko‘paytirish">+</button></div>` : `<button class="add" data-act="inc" data-v="${i}">+ Qo‘shish</button>`}</li>`; }).join("")}</ul>
      <div class="cartbar"><button class="btn" data-act="checkout" ${q ? "" : "disabled"}>${q ? `Savat · ${q} ta · ${fmt(cartSum(o))}` : "Savat bo‘sh"}</button></div>`;
  }
  if (o.stage === "checkout") {
    const s = STORES[o.store], kg = cartKg(o), u = pdist(s.node, USER);
    const has = pickTransport(s.node, USER, kg);

      <div class="field"><span class="lbl">Kim olib keladi · og‘irligi ≈${kg.toFixed(1)} kg</span>${transportCards(s.node, USER, kg, s.prep)}</div>
      <div class="bd">${cartList(o).map(x => `<span>${x.it[0]} × ${x.q}</span><span>${fmt(x.it[2] * x.q)}</span>`).join("")}
        <span>Yetkazish (${CT[o.transport].name.toLowerCase()})</span><span>${has ? fmt(fee) : "—"}</span>
        <span class="tot">Jami</span><span class="tot">${has ? fmt(goods + fee) : "—"}</span></div>
      <div class="chips"><button class="chip ${o.pay === "naqd" ? "on" : ""}" data-act="dpay" data-v="naqd">Naqd kuryerga</button><button class="chip ${o.pay === "karta" ? "on" : ""}" data-act="dpay" data-v="karta">Karta (Click, Payme)</button></div>
      <button class="btn" data-act="orderGo" ${has ? "" : "disabled"}>Buyurtma berish${has ? " · " + fmt(goods + fee) : ""}</button>`;
  }
  const r = o.ord, code = `<div class="code-box"><small>${r.store ? "Kuryerga shu kodni ayting, shunda buyurtma topshiriladi" : "Qabul qiluvchi bu kodni kuryerga aytadi"}</small><span class="code">${o.code}</span></div>`;
  if (o.stage === "search") return `
      <div class="status center">${radar(SVG.bag)}<h2>Kuryer qidirilmoqda</h2><p>${r.title}</p></div>
      <div class="sum"><span>${CT[r.transport].name}</span><b>${fmt(r.total)}</b></div>

  if (o.stage === "pickup") return `
      <div class="status"><h2>${r.store ? "Kuryer " + r.store + "ga ketyapti" : "Kuryer jo‘natmani olishga ketyapti"}</h2><p>${NAMES[r.from]} · <span class="num" id="eta">…</span> daqiqa${r.store ? ". Taom tayyorlanmoqda" : ""}</p></div>
      ${dcard(o.car, o.showPhone)}${code}

  if (o.stage === "prep") return `
      <div class="status"><h2>${r.store ? "Kuryer buyurtmangizni olyapti" : "Kuryer jo‘natmani olyapti"}</h2><p>${r.store ? r.store + " qadoqlab bermoqda" : NAMES[r.from]}</p></div>
      ${dcard(o.car, false)}${code}`;
  if (o.stage === "way") return `

      <div class="prog"><i id="prog"></i></div>
      ${dcard(o.car, false)}${code}
      <div class="sum"><span>${r.items}</span><b>${fmt(r.total)}</b></div>`;
  return `
      <div class="status center"><h2>${r.store ? "Buyurtma yetkazildi" : "Jo‘natma topshirildi"}</h2><p>${NAMES[r.to]} · kod ${o.code} tasdiqlandi</p><span class="big-price">${fmt(r.total)}</span></div>
      <div class="bd">${r.goods ? `<span>Mahsulotlar</span><span>${fmt(r.goods)}</span>` : ""}<span>Yetkazish (${CT[r.transport].name.toLowerCase()})</span><span>${fmt(r.fee)}</span><span class="tot">Jami</span><span class="tot">${fmt(r.total)}</span></div>
      ${stars(o.rating)}
      <button class="btn" data-act="delNew">Yangi buyurtma</button>`;

function rCourier() {
  const cs = S.cour, t = CT[MC.type];
  let body = "";
  if (cs.trip) {
    const j = cs.trip;
    const head = { toStore: [`${j.store ? j.store + "ga" : "Jo‘natma oldiga"}`, `${NAMES[j.from]} · <span class="num" id="ceta">…</span> daqiqa`],
      atStore: [j.store ? "Buyurtmani oling" : "Jo‘natmani oling", `${j.items}`],
      toClient: ["Mijozga", `${NAMES[j.to]} · <span class="num" id="ceta">…</span> daqiqa`],

    body = `<div class="status"><h2>${head[0]}</h2><p>${head[1]}</p></div>`;
    if (j.stage === "toClient") body += `<div class="prog"><i id="cprog"></i></div>`;
    body += `<div class="trip compact"><div class="pt"><span class="mk a">A</span><div><b>${j.store || NAMES[j.from]}</b></div></div><div class="pt"><span class="mk b">B</span><div><b>${NAMES[j.to]}</b></div><span class="dist">${fmt(j.fee)}</span></div></div>`;
    if (j.stage === "atStore") body += `<button class="btn" data-act="cGot">Oldim, yo‘lga chiqaman</button>`;
    if (j.stage === "atClient") body += `<div class="field"><label for="cCode">Mijoz aytgan 4 xonali kod</label><input class="inp" id="cCode" inputmode="numeric" maxlength="4" placeholder="• • • •" autocomplete="off"></div>
      ${cs.err ? `<p class="err">${cs.err}</p>` : ""}<p class="hint">Namunada mijoz kodi: ${j.code}</p>
      <button class="btn" data-act="cDone">Topshirdim</button>`;
  } else if (cs.offer) {
    const f = cs.offer, fee10 = Math.round(f.fee * .1), tax = Math.round(f.fee * .01);
    body = `<div class="offer">
      <div class="ohead"><b>Yangi buyurtma</b><span class="oprice">${fmt(f.fee - fee10 - tax)}</span></div>
      <div class="ometa">${f.items}</div>
      <div class="trip compact"><div class="pt"><span class="mk a">A</span><div><b>${f.store || NAMES[f.from]}</b></div><span class="dist">${km(f.pick).toFixed(1)} km sizdan</span></div><div class="pt"><span class="mk b">B</span><div><b>${NAMES[f.to]}</b></div><span class="dist">${km(f.u).toFixed(1)} km</span></div></div>
      <div class="ometa">Mijoz to‘laydi ${fmt(f.fee)} · sizga xizmat haqi va soliqdan keyin</div>
      <div class="prog"><i id="cbar" style="width:100%"></i></div>
      <div class="row2"><button class="btn ghost" data-act="cSkip">O‘tkazib yuborish</button><button class="btn" data-act="cAccept">Qabul qilish</button></div></div>`;
  } else body = `<div class="idle">${cs.online ? `<span class="live-dot"></span>Buyurtma kutilmoqda. ${t.name}da ${t.max} km gacha buyurtmalar keladi.` : "Siz dam olyapsiz. Buyurtma olish uchun «Ishdaman»ni yoqing."}</div>`;
  const lt = cs.last;
  return `
    <div class="drv-head"><div class="ava c">${initials(MC.name)}</div><div class="dinfo"><b>${MC.name}</b><span>Kuryer · ${t.name} · ★ ${MC.rating}</span></div>
      <button class="switch" role="switch" aria-checked="${cs.online}" data-act="cToggle" ${cs.trip ? "disabled" : ""}><span>${cs.online ? "Ishdaman" : "Dam olyapman"}</span><span class="knob"></span></button></div>
    <div class="field"><span class="lbl">Transportingiz</span><div class="chips">${COUR_T.filter(x => x.id !== "avto").map(x => `<button class="chip ${MC.type === x.id ? "on" : ""}" data-act="cType" data-v="${x.id}" ${cs.trip || cs.offer ? "disabled" : ""}>${x.name}</button>`).join("")}</div></div>
    <div class="stats"><div class="stat"><small>Bugun</small><b>${fmt(cs.earn)}</b></div><div class="stat"><small>Yetkazildi</small><b>${cs.trips}</b></div><div class="stat"><small>Reyting</small><b>★ ${MC.rating}</b></div></div>
    ${body}
    ${lt ? `<div class="bd"><span class="cap">Oxirgi yetkazish · ${lt.where}</span><span>Yetkazish haqi</span><span>${fmt(lt.fee)}</span><span>Xizmat haqi (10%)</span><span class="neg">−${fmt(lt.f10)}</span><span>Soliq (1%)</span><span class="neg">−${fmt(lt.tax)}</span><span class="tot">Sizga</span><span class="tot">${fmt(lt.net)}</span></div>` : ""}`;
}
function rDel() {
  const o = S.del;
  return `<div class="seg"><button class="${o.mode === "client" ? "on" : ""}" data-act="dmode" data-v="client">Buyurtmachi</button><button class="${o.mode === "courier" ? "on" : ""}" data-act="dmode" data-v="courier">Kuryer ilovasi</button></div>`
    + (o.mode === "courier" ? rCourier() : rDelClient());
}

/* ================= Yuk tashish ================= */
function rYuk() {
  const o = S.yuk, t = GT[o.veh];
  if (o.stage === "form") {
    const ok = o.to != null && o.to !== o.from, u = ok ? pdist(o.from, o.to) : 0;
    return `
      <div class="status"><h2>Yuk tashish</h2><p>Mototsikldan KamAZgacha. Narx oldindan ko‘rinadi</p></div>
      <div class="grid2">
        <div class="field"><label for="yFrom">Qayerdan</label><select class="inp" id="yFrom">${nodeOpts(o.from)}</select></div>
        <div class="field"><label for="yTo">Qayerga</label><select class="inp" id="yTo"><option value="" ${o.to == null ? "selected" : ""} disabled>Tanlang</option>${nodeOpts(o.to)}</select></div>
      </div>
      <div class="vlist">${CARGO_T.map(x => {
        const c = nearestFree(cargos, o.from, v => v.type === x.id);
        return `<button class="veh ${o.veh === x.id ? "on" : ""}" data-act="veh" data-id="${x.id}" aria-pressed="${o.veh === x.id}"><span class="vic">${vIcon(x.id)}</span><span><b>${x.name}</b><span>${x.sub} · ${x.cap}</span><span>${c ? "≈" + mins(distTo(c, o.from), x.kmh) + " daqiqada keladi" : "Hozir band"}</span></span><span class="vp"><b>${ok ? fmt(cargoPrice(x, u, 0)) : fmt(x.min)}</b><span>${ok ? km(u).toFixed(1) + " km" : "dan"}</span></span></button>`;
      }).join("")}</div>
      <div class="helpers"><div><b>Yuklovchi yordamchi</b><small>Har biri ${fmt(HELPER)}</small></div><div class="step"><button data-act="hDec" aria-label="Kamaytirish">−</button><b>${o.helpers}</b><button data-act="hInc" aria-label="Ko‘paytirish">+</button></div></div>
      ${ok ? "" : `<p class="hint">Manzilni ro‘yxatdan tanlang yoki xaritaga bosing.</p>`}
      <button class="btn" data-act="yGo" ${ok ? "" : "disabled"}>${t.name} chaqirish${ok ? " · " + fmt(cargoPrice(t, u, o.helpers)) : ""}</button>`;
  }
  if (o.stage === "search") return `
      <div class="status center">${radar(SVG.truck)}<h2>${t.name} qidirilmoqda</h2><p>${NAMES[o.from]} → ${NAMES[o.to]}</p></div>
      <div class="sum"><span>${t.name}${o.helpers ? " · " + o.helpers + " yordamchi" : ""}</span><b>${fmt(o.price)}</b></div>
      <button class="btn ghost danger" data-act="yCancel">Bekor qilish</button>`;
  if (o.stage === "coming") return `
      <div class="status"><h2>${t.name} yo‘lda</h2><p>${NAMES[o.from]}ga <span class="num" id="eta">…</span> daqiqada yetadi</p></div>
      ${dcard(o.car, o.showPhone)}
      <div class="row2"><button class="btn ghost" data-act="yPhone">${o.showPhone ? "Raqamni yashirish" : "Qo‘ng‘iroq"}</button><button class="btn ghost danger" data-act="yCancel">Bekor qilish</button></div>
      <div class="sum"><span>${t.name}${o.helpers ? " · " + o.helpers + " yordamchi" : ""}</span><b>${fmt(o.price)}</b></div>`;
  if (o.stage === "loading") return `
      <div class="status"><h2>Yuk ortilmoqda</h2><p>${NAMES[o.from]}. Tayyor bo‘lgach tugmani bosing</p></div>
      ${dcard(o.car, false)}
      <button class="btn" data-act="yLoaded">Yuk ortildi, jo‘nash</button>`;
  if (o.stage === "ride") return `
      <div class="status"><h2>Yuk yo‘lda</h2><p>${NAMES[o.to]}gacha <span class="num" id="eta">…</span> daqiqa</p></div>
      <div class="prog"><i id="prog"></i></div>
      ${dcard(o.car, false)}
      <div class="sum"><span>${t.name}</span><b>${fmt(o.price)}</b></div>`;
  const u = pdist(o.from, o.to), base = cargoPrice(t, u, 0);
  return `
      <div class="status center"><h2>Yuk yetkazildi</h2><p>${NAMES[o.to]} · ${o.car.name}</p><span class="big-price">${fmt(o.price)}</span></div>
      <div class="bd"><span>${t.name}, ${km(u).toFixed(1)} km</span><span>${fmt(base)}</span>${o.helpers ? `<span>Yordamchi × ${o.helpers}</span><span>${fmt(o.helpers * HELPER)}</span>` : ""}<span class="tot">Jami</span><span class="tot">${fmt(o.price)}</span></div>
      ${stars(o.rating)}
      <button class="btn" data-act="yNew">Yangi buyurtma</button>`;
}

/* ================= Marshrut ================= */
function rBus() {
  const R = ROUTES[S.bus.r], stop = S.bus.stop[S.bus.r];
  return `
    <div class="rchips">${ROUTES.map((x, i) => `<button class="rchip ${i === S.bus.r ? "on" : ""}" style="--rc:var(--${x.cv})" data-act="route" data-v="${i}" aria-pressed="${i === S.bus.r}"><span class="rno">№${x.no}</span><span>${x.kind} · ${fmt(x.fare)}</span></button>`).join("")}</div>
    <div class="next" style="--rc:var(--${R.cv})">

}

/* ================= Haydovchi ================= */
function rDrv() {
  const dd = S.drv;
  let body = "";
  if (dd.trip) {
    const t = dd.trip;
    if (t.stage === "pickup") body = `<div class="status"><h2>Yo‘lovchi oldiga</h2><p>${NAMES[t.from]} · <span class="num" id="reta">…</span> daqiqa</p></div>`;
    else if (t.stage === "wait") body = `<div class="status"><h2>Yo‘lovchi chiqmoqda</h2><p>${NAMES[t.from]}da kutyapsiz</p></div>`;
    else body = `<div class="status"><h2>Manzilga</h2><p>${NAMES[t.to]} · <span class="num" id="reta">…</span> daqiqa</p></div><div class="prog"><i id="rprog"></i></div>`;
    body += `<div class="trip compact"><div class="pt"><span class="mk a">A</span><div><b>${NAMES[t.from]}</b></div></div><div class="pt"><span class="mk b">B</span><div><b>${NAMES[t.to]}</b></div><span class="dist">${fmt(t.price)}</span></div></div>`;
  } else if (dd.offer) {
    const f = dd.offer;
    body = `<div class="offer">
      <div class="ohead"><b>Yangi buyurtma</b><span class="oprice">${fmt(f.price)}</span></div>
      <div class="trip compact"><div class="pt"><span class="mk a">A</span><div><b>${NAMES[f.from]}</b></div><span class="dist">${km(f.pick).toFixed(1)} km sizdan</span></div><div class="pt"><span class="mk b">B</span><div><b>${NAMES[f.to]}</b></div><span class="dist">${km(f.u).toFixed(1)} km</span></div></div>
      <div class="prog"><i id="obar" style="width:100%"></i></div>
      <div class="row2"><button class="btn ghost" data-act="skip">O‘tkazib yuborish</button><button class="btn" data-act="accept">Qabul qilish</button></div></div>`;
  } else body = `<div class="idle">${dd.online ? `<span class="live-dot"></span>Buyurtma kutilmoqda. Yaqin atrofdagi so‘rovlar shu yerda chiqadi.` : "Siz hozir dam olyapsiz. Buyurtma olish uchun «Ishdaman» tugmasini yoqing."}</div>`;
  const lt = dd.last;
  return `
    <div class="drv-head"><div class="ava">${initials(ME.name)}</div><div class="dinfo"><b>${ME.name}</b><span>${ME.model}, ${ME.color} · ${ME.plate}</span></div>
      <button class="switch" role="switch" aria-checked="${dd.online}" data-act="toggle" ${dd.trip ? "disabled" : ""}><span>${dd.online ? "Ishdaman" : "Dam olyapman"}</span><span class="knob"></span></button></div>
    <div class="stats"><div class="stat"><small>Bugun</small><b>${fmt(dd.earn)}</b></div><div class="stat"><small>Safarlar</small><b>${dd.trips}</b></div><div class="stat"><small>Reyting</small><b>★ ${ME.rating}</b></div></div>
    ${body}
    ${lt ? `<div class="bd"><span class="cap">Oxirgi safar · ${NAMES[lt.from]} → ${NAMES[lt.to]}</span><span>Yo‘lovchi to‘ladi</span><span>${fmt(lt.price)}</span><span>Xizmat haqi (10%)</span><span class="neg">−${fmt(lt.fee)}</span><span>Soliq (1%)</span><span class="neg">−${fmt(lt.tax)}</span><span class="tot">Sizga</span><span class="tot">${fmt(lt.net)}</span></div>` : ""}`;
}

/* ================= Narxlar ro'yxati ================= */

    <div class="psec"><h3>Yuk tashish</h3><div class="twrap"><table><thead><tr><th>Transport</th><th>Chiqish</th><th>1 km</th><th>Eng kam</th></tr></thead><tbody>
      ${CARGO_T.map(t => row([`<b>${t.name}</b><span>${t.cap}</span>`, fmtK(t.base), fmtK(t.perKm), fmtK(t.min)])).join("")}
      ${row([`<b>Yuklovchi yordamchi</b><span>1 kishi, 1 buyurtma</span>`, "", "", fmtK(HELPER)])}</tbody></table></div></div>

      ${COUR_T.map(t => row([`<b>${t.name}</b><span>${t.capKg} kg gacha</span>`, fmtK(t.base), fmtK(t.perKm), `${t.max} km gacha`])).join("")}</tbody></table></div>

const pricesEl = document.getElementById("prices");
document.getElementById("pricesBtn").addEventListener("click", () => { renderPrices(); pricesEl.hidden = false; pricesEl.scrollTop = 0; pricesEl.querySelector(".x").focus(); });
pricesEl.addEventListener("click", e => { if (e.target.closest("[data-close]")) pricesEl.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") pricesEl.hidden = true; });

/* ================= Render va jonli yangilash ================= */
let lastKey = "";
function render() {
  const t = S.tab;
  const html = t === "taxi" ? rTaxi() : t === "del" ? rDel() : t === "yuk" ? rYuk() : t === "bus" ? rBus() : rDrv();
  sheet.innerHTML = `<div class="grip"></div><div class="sheet-in">${html}</div>`;
  const key = t + (t === "taxi" ? S.taxi.stage : t === "del" ? S.del.mode + S.del.stage + S.del.kind : t === "yuk" ? S.yuk.stage : "");
  if (key !== lastKey) { sheet.scrollTop = 0; lastKey = key; }
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  live();
}
const setT = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== String(v)) e.textContent = v; };
const setW = (id, f) => { const e = document.getElementById(id); if (e) e.style.width = (Math.max(0, Math.min(1, f)) * 100).toFixed(1) + "%"; };

function live() {
  const now = performance.now(), dd = S.drv, cs = S.cour;
  if (dd.offer && now > dd.offer.exp) { dd.offer = null; if (S.tab === "drv") render(); scheduleOffer(); return; }
  if (cs.offer && now > cs.offer.exp) { cs.offer = null; if (S.tab === "del") render(); scheduleCour(); return; }
  const t = S.tab;
  const badge = t === "taxi" ? `${taxis.filter(c => c.free).length} ta bo‘sh taksi`
    : t === "del" ? (S.del.mode === "courier" ? (cs.online ? "Siz ishdasiz" : "Siz dam olyapsiz") : `${couriers.filter(c => c.free).length} ta kuryer bo‘sh`)
    : t === "yuk" ? `${cargos.filter(c => c.free).length} ta yuk transporti bo‘sh`
    : t === "bus" ? `${ROUTES.reduce((s, R) => s + R.n, 0)} ta avtobus va marshrutka` : (dd.online ? "Siz ishdasiz" : "Siz dam olyapsiz");
  setT("badgeTxt", badge);
  if (t === "taxi") {
    const o = S.taxi;
    if (o.stage === "select") {
      const c = nearestFree(taxis, USER), m = c ? `≈${mins(distTo(c, USER), 27)} daq. yetadi` : "Hammasi band";
      document.querySelectorAll(".teta").forEach(e => { if (e.textContent !== m) e.textContent = m; });
    }
    if (o.car && (o.stage === "coming" || o.stage === "ride")) setT("eta", mins(rem(o.car), 27));
    if (o.stage === "ride") setW("prog", 1 - rem(o.car) / o.total);
  } else if (t === "del") {
    const o = S.del;
    if (o.mode === "client" && o.car && (o.stage === "pickup" || o.stage === "way")) setT("eta", mins(rem(o.car), o.car.kmh));
    if (o.mode === "client" && o.stage === "way") setW("prog", 1 - rem(o.car) / o.total);
    if (o.mode === "courier") {
      if (cs.offer) setW("cbar", (cs.offer.exp - now) / 20000);
      if (cs.trip) { setT("ceta", mins(rem(MC), MC.kmh)); if (cs.trip.stage === "toClient") setW("cprog", 1 - rem(MC) / cs.trip.total); }
    }
  } else if (t === "yuk") {
    const o = S.yuk;
    if (o.car && (o.stage === "coming" || o.stage === "ride")) setT("eta", mins(rem(o.car), o.car.kmh));
    if (o.stage === "ride") setW("prog", 1 - rem(o.car) / o.total);
  } else if (t === "bus") {
    const R = ROUTES[S.bus.r], ds = busD(R, S.bus.stop[S.bus.r]);
    const big = document.getElementById("mEta");
    if (big) { const h = ds[0] < 14 ? `hozir<small>bekatda turibdi</small>` : `${busMin(ds[0])}<small>daqiqada keladi</small>`; if (big.innerHTML !== h) big.innerHTML = h; }
    setT("mEta2", `${busMin(ds[1])} daqiqadan keyin`);
    document.querySelectorAll("[data-m]").forEach(e => { const x = busD(R, +e.dataset.m)[0]; const s = x < 14 ? "bekatda" : `${busMin(x)} daq`; if (e.textContent !== s) e.textContent = s; });
  } else if (t === "drv") {
    if (dd.offer) setW("obar", (dd.offer.exp - now) / 15000);
    if (dd.trip) { setT("reta", mins(rem(ME), 27)); if (dd.trip.stage === "ride") setW("rprog", 1 - rem(ME) / dd.trip.total); }
  }
}
const rerenderIf = tab => { if (S.tab === tab) render(); };

/* ================= Taksi oqimi ================= */
function callTaxi() {
  const o = S.taxi, t = TAXI_T.find(x => x.id === o.tariff);
  o.price = taxiPrice(t, pdist(USER, o.to));
  o.stage = "search"; o.rating = 0; o.showPhone = false;
  const tok = ++o.tok; render();
  setTimeout(() => {
    if (o.tok !== tok) return;
    const c = nearestFree(taxis, USER);
    if (!c) { o.stage = "select"; rerenderIf("taxi"); toast("Hozir bo‘sh taksi yo‘q, birozdan keyin urinib ko‘ring"); return; }
    c.free = false; o.car = c; o.stage = "coming"; o.total = distTo(c, USER);
    rerenderIf("taxi"); toast(`${c.name} buyurtmangizni qabul qildi`);
    driveTo(c, USER, () => { if (o.tok !== tok) return; o.stage = "arrived"; rerenderIf("taxi"); toast("Haydovchi yetib keldi"); });
  }, 2200);
}
function sit() {
  const o = S.taxi, tok = o.tok;
  o.stage = "ride"; o.total = pdist(USER, o.to) || 1; render();
  driveTo(o.car, o.to, () => { if (o.tok !== tok) return; o.stage = "done"; release(o.car); rerenderIf("taxi"); toast(`${NAMES[o.to]} · yetib keldingiz`); });
}
function cancelTaxi() {
  const o = S.taxi; o.tok++;
  if (o.car) { release(o.car); o.car = null; }
  o.stage = "select"; render(); toast("Buyurtma bekor qilindi");
}

/* ================= Yetkazish oqimi (mijoz) ================= */
function startDelivery(ord) {
  const o = S.del;
  o.ord = ord; o.code = String(1000 + rnd(9000)); o.stage = "search"; o.showPhone = false; o.rating = 0;
  const tok = ++o.tok; render();
  setTimeout(() => {
    if (o.tok !== tok) return;
    const c = nearestFree(couriers, ord.from, x => x.type === ord.transport) || nearestFree(couriers, ord.from, x => km(pdist(ord.from, ord.to)) <= CT[x.type].max);
    if (!c) { o.stage = "browse"; o.ord = null; rerenderIf("del"); toast("Hozir bo‘sh kuryer yo‘q"); return; }
    c.free = false; o.car = c; o.stage = "pickup"; o.total = distTo(c, ord.from);
    rerenderIf("del"); toast(`Kuryer ${c.name} yo‘lga chiqdi`);
    driveTo(c, ord.from, () => {
      if (o.tok !== tok) return;
      o.stage = "prep"; rerenderIf("del");
      setTimeout(() => {
        if (o.tok !== tok) return;
        o.stage = "way"; o.total = pdist(ord.from, ord.to) || 1; rerenderIf("del");
        driveTo(c, ord.to, () => { if (o.tok !== tok) return; o.stage = "done"; release(c); o.cart = {}; rerenderIf("del"); toast(ord.store ? "Buyurtma yetkazildi. Yoqimli ishtaha!" : "Jo‘natma topshirildi"); });
      }, ord.store ? 3000 : 1800);
    });
  }, 2000);
}
function orderFromStore() {
  const o = S.del, s = STORES[o.store], u = pdist(s.node, USER), fee = courFee(CT[o.transport], u), goods = cartSum(o);
  const items = cartList(o).map(x => `${x.it[0]} × ${x.q}`).join(", ");
  startDelivery({ from: s.node, to: USER, store: s.name, items, goods, fee, total: goods + fee, transport: o.transport, title: `${s.name} → ${NAMES[USER]}` });
}
function orderParcel() {
  const o = S.del, fee = courFee(CT[o.transport], pdist(o.from, o.to));
  startDelivery({ from: o.from, to: o.to, store: null, items: ITEMS[o.item].n, goods: 0, fee, total: fee, transport: o.transport, title: `${NAMES[o.from]} → ${NAMES[o.to]}` });
}
function cancelDel() {
  const o = S.del; o.tok++;
  if (o.car) { release(o.car); o.car = null; }
  const back = o.ord && o.ord.store ? "checkout" : "browse";
  o.ord = null; o.stage = back; render(); toast("Buyurtma bekor qilindi");
}

/* ================= Kuryer ilovasi oqimi ================= */
function scheduleCour() {
  const cs = S.cour; clearTimeout(cs.timer);
  if (!cs.online || cs.trip) return;
  cs.timer = setTimeout(makeCourOffer, 3500);
}
function makeCourOffer() {
  const cs = S.cour, t = CT[MC.type];
  if (!cs.online || cs.trip || cs.offer) return;
  const maxU = t.max / KM, pickMax = Math.min(maxU, 520);
  let s, tries = 0;
  const near = STORES.filter(x => distTo(MC, x.node) <= pickMax && distTo(MC, x.node) > 0);
  const pool = near.length ? near : STORES;
  s = pool[rnd(pool.length)];
  let to; do { to = rnd(25); tries++; } while ((to === s.node || pdist(s.node, to) < 110 || pdist(s.node, to) > maxU) && tries < 80);
  if (tries >= 80) { scheduleCour(); return; }
  const n = 1 + rnd(3), picks = [];
  for (let i = 0; i < n; i++) { const m = s.menu[rnd(s.menu.length)]; picks.push(`${m[0]} × ${1 + rnd(2)}`); }
  const u = pdist(s.node, to);
  cs.offer = { from: s.node, to, store: s.name, items: picks.join(", "), u, fee: courFee(t, u), pick: distTo(MC, s.node), exp: performance.now() + 20000, code: String(1000 + rnd(9000)) };
  if (S.tab === "del" && S.del.mode === "courier") render(); else toast("Kuryer ilovasida yangi buyurtma bor");
}
function courAccept() {
  const cs = S.cour, f = cs.offer; if (!f) return;
  cs.offer = null; cs.err = "";
  cs.trip = Object.assign({}, f, { stage: "toStore", total: f.pick || 1 });
  render();
  driveTo(MC, f.from, () => { cs.trip.stage = "atStore"; if (S.tab === "del") render(); toast("Do‘konga yetib keldingiz"); });
}
function courGot() {
  const cs = S.cour, j = cs.trip; if (!j) return;
  j.stage = "toClient"; j.total = j.u || 1; render();
  driveTo(MC, j.to, () => { j.stage = "atClient"; if (S.tab === "del") render(); toast("Mijozga yetib keldingiz"); });
}
function courDone() {
  const cs = S.cour, j = cs.trip; if (!j) return;
  const inp = document.getElementById("cCode"), v = inp ? inp.value.trim() : "";
  if (v !== j.code) { cs.err = v ? "Kod noto‘g‘ri. Mijozdan qayta so‘rang." : "Avval mijoz aytgan kodni kiriting."; render(); return; }
  const f10 = Math.round(j.fee * .1), tax = Math.round(j.fee * .01), net = j.fee - f10 - tax;
  cs.earn += net; cs.trips++; cs.last = { where: `${j.store} → ${NAMES[j.to]}`, fee: j.fee, f10, tax, net };
  cs.trip = null; cs.err = "";
  MC.speed = MC.cruise; MC.stopped = false; MC.to = wander(MC); MC.t = 0;
  render(); toast(`Topshirildi: +${fmt(net)}`);
  scheduleCour();
}
function courToggle() {
  const cs = S.cour;
  if (cs.trip) return;
  if (!cs.online) { cs.online = true; MC.stopped = false; MC.speed = MC.cruise; if (MC.from === MC.to) { MC.to = wander(MC); MC.t = 0; } toast("Siz ishdasiz. Buyurtmalar kela boshlaydi"); scheduleCour(); }
  else { cs.online = false; cs.offer = null; clearTimeout(cs.timer); MC.stopped = true; }
  render();
}
function courType(id) {
  MC.type = id; MC.kmh = CT[id].kmh; MC.cruise = simSp(MC.kmh); MC.speed = MC.cruise; render();
}

/* ================= Yuk oqimi ================= */
function callCargo() {
  const o = S.yuk, t = GT[o.veh];
  o.price = cargoPrice(t, pdist(o.from, o.to), o.helpers);
  o.stage = "search"; o.rating = 0; o.showPhone = false;
  const tok = ++o.tok; render();
  setTimeout(() => {
    if (o.tok !== tok) return;
    const c = nearestFree(cargos, o.from, x => x.type === o.veh);
    if (!c) { o.stage = "form"; rerenderIf("yuk"); toast(`Hozir bo‘sh ${t.name} yo‘q`); return; }
    c.free = false; o.car = c; o.stage = "coming"; o.total = distTo(c, o.from);
    rerenderIf("yuk"); toast(`${c.name} buyurtmani qabul qildi`);
    driveTo(c, o.from, () => { if (o.tok !== tok) return; o.stage = "loading"; rerenderIf("yuk"); toast(`${t.name} yetib keldi`); });
  }, 2200);
}
function cargoGo() {
  const o = S.yuk, tok = o.tok;
  o.stage = "ride"; o.total = pdist(o.from, o.to) || 1; render();
  driveTo(o.car, o.to, () => { if (o.tok !== tok) return; o.stage = "done"; release(o.car); rerenderIf("yuk"); toast("Yuk yetkazildi"); });
}
function cancelCargo() {
  const o = S.yuk; o.tok++;
  if (o.car) { release(o.car); o.car = null; }
  o.stage = "form"; render(); toast("Buyurtma bekor qilindi");
}

/* ================= Haydovchi oqimi ================= */
function scheduleOffer() {
  const dd = S.drv; clearTimeout(dd.timer);
  if (!dd.online || dd.trip) return;
  dd.timer = setTimeout(makeOffer, 3500);
}
function makeOffer() {
  const dd = S.drv;
  if (!dd.online || dd.trip || dd.offer) return;
  let from, to, tries = 0;
  do { from = rnd(25); } while ((from === ME.from || from === ME.to || distTo(ME, from) < 120 || distTo(ME, from) > 520) && tries++ < 60);
  tries = 0;
  do { to = rnd(25); } while ((to === from || pdist(from, to) < 260) && tries++ < 60);
  const u = pdist(from, to);
  dd.offer = { from, to, u, price: taxiPrice(TAXI_T[0], u), pick: distTo(ME, from), exp: performance.now() + 15000 };
  if (S.tab === "drv") render(); else toast("Haydovchi ilovasida yangi buyurtma bor");
}
function accept() {
  const dd = S.drv, f = dd.offer; if (!f) return;
  dd.offer = null;
  dd.trip = { stage: "pickup", from: f.from, to: f.to, price: f.price, total: f.pick || 1 };
  render();
  driveTo(ME, f.from, () => {
    dd.trip.stage = "wait"; rerenderIf("drv");
    setTimeout(() => { dd.trip.stage = "ride"; dd.trip.total = f.u || 1; rerenderIf("drv"); driveTo(ME, f.to, finishTrip); }, 2200);
  });
}
function finishTrip() {
  const dd = S.drv, t = dd.trip;
  const fee = Math.round(t.price * 0.10), tax = Math.round(t.price * 0.01), net = t.price - fee - tax;
  dd.earn += net; dd.trips += 1; dd.last = { from: t.from, to: t.to, price: t.price, fee, tax, net };
  dd.trip = null; ME.speed = ME.cruise;
  if (dd.online) { ME.stopped = false; ME.to = wander(ME); ME.t = 0; }
  rerenderIf("drv"); toast(`Safar yakunlandi: +${fmt(net)}`);
  scheduleOffer();
}
function toggleOnline() {
  const dd = S.drv;
  if (dd.trip) return;
  if (!dd.online) { dd.online = true; ME.stopped = false; ME.speed = ME.cruise; if (ME.from === ME.to) { ME.to = wander(ME); ME.t = 0; } toast("Siz ishdasiz. Buyurtmalar kela boshlaydi"); scheduleOffer(); }
  else { dd.online = false; dd.offer = null; clearTimeout(dd.timer); ME.stopped = true; }
  render();
}

/* ================= Hodisalar ================= */
sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, o = S.taxi, q = S.del, y = S.yuk;
  const ratingTarget = S.tab === "taxi" ? o : S.tab === "yuk" ? y : q;
  switch (a) {
    case "dest": o.to = +b.dataset.n; render(); break;
    case "tariff": o.tariff = b.dataset.id; render(); break;
    case "call": callTaxi(); break;
    case "cancel": cancelTaxi(); break;
    case "phone": o.showPhone = !o.showPhone; render(); break;
    case "sit": sit(); break;
    case "pay": o.pay = b.dataset.v; render(); break;
    case "star": ratingTarget.rating = +b.dataset.v; render(); break;
    case "newTaxi": o.stage = "select"; o.to = null; o.car = null; render(); break;
    // yetkazish: mijoz
    case "dmode": q.mode = b.dataset.v; render(); break;
    case "kind": q.kind = b.dataset.v; q.store = null; render(); break;
    case "store": {
      const id = +b.dataset.v;
      if (q.store !== id && cartQty(q)) toast("Savat yangi do‘kon uchun tozalandi");
      if (q.store !== id) q.cart = {};
      q.store = id; q.stage = "store"; render(); break;
    }
    case "inc": q.cart[+b.dataset.v] = (q.cart[+b.dataset.v] || 0) + 1; render(); break;
    case "dec": q.cart[+b.dataset.v] = Math.max(0, (q.cart[+b.dataset.v] || 0) - 1); render(); break;
    case "toBrowse": q.stage = "browse"; render(); break;
    case "toStore": q.stage = "store"; render(); break;
    case "checkout": q.stage = "checkout"; render(); break;
    case "transport": q.transport = b.dataset.id; render(); break;
    case "dpay": q.pay = b.dataset.v; render(); break;
    case "orderGo": orderFromStore(); break;
    case "item": q.item = +b.dataset.v; render(); break;
    case "parcelGo": orderParcel(); break;
    case "delCancel": cancelDel(); break;
    case "dphone": q.showPhone = !q.showPhone; render(); break;
    case "delNew": q.stage = "browse"; q.ord = null; q.car = null; q.to = null; render(); break;
    // kuryer ilovasi
    case "cToggle": courToggle(); break;
    case "cType": courType(b.dataset.v); break;
    case "cAccept": courAccept(); break;
    case "cSkip": S.cour.offer = null; render(); scheduleCour(); break;
    case "cGot": courGot(); break;
    case "cDone": courDone(); break;
    // yuk
    case "veh": y.veh = b.dataset.id; render(); break;
    case "hInc": y.helpers = Math.min(4, y.helpers + 1); render(); break;
    case "hDec": y.helpers = Math.max(0, y.helpers - 1); render(); break;
    case "yGo": callCargo(); break;
    case "yCancel": cancelCargo(); break;
    case "yPhone": y.showPhone = !y.showPhone; render(); break;
    case "yLoaded": cargoGo(); break;
    case "yNew": y.stage = "form"; y.to = null; y.car = null; y.helpers = 0; render(); break;
    // marshrut
    case "route": S.bus.r = +b.dataset.v; render(); break;
    case "stop": S.bus.stop[S.bus.r] = +b.dataset.n; render(); break;
    // haydovchi
    case "toggle": toggleOnline(); break;
    case "accept": accept(); break;
    case "skip": S.drv.offer = null; render(); scheduleOffer(); break;
  }
});
sheet.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dFrom") { S.del.from = +t.value; render(); }
  if (t.id === "dTo") { S.del.to = +t.value; render(); }
  if (t.id === "yFrom") { S.yuk.from = +t.value; render(); }
  if (t.id === "yTo") { S.yuk.to = +t.value; render(); }
});
sheet.addEventListener("input", e => { if (e.target.id === "dPhone") S.del.phone = e.target.value; });
sheet.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cCode") courDone(); });
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  S.tab = b.dataset.tab; try { localStorage.setItem("yoldosh-tab", S.tab); } catch (e) {}
  render();
}));
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const vx = (e.clientX - r.left - OX) / SC + VX, vy = (e.clientY - r.top - OY) / SC + VY;
  const t = S.tab, q = S.del;
  let pool = NODES.map((_, i) => i);
  if (t === "bus") pool = ROUTES[S.bus.r].stops;
  if (t === "del" && q.mode === "client" && q.stage === "browse" && q.kind !== "parcel") pool = STORES.filter(s => s.kind === q.kind).map(s => s.node);
  let best = -1, bd = Infinity;
  for (const n of pool) { const x = Math.hypot(NODES[n].x - vx, NODES[n].y - vy); if (x < bd) { bd = x; best = n; } }
  if (best < 0 || bd > 90) return;
  if (t === "taxi" && S.taxi.stage === "select") {
    if (best === USER) { toast("Siz shu yerdasiz, boshqa manzil tanlang"); return; }
    S.taxi.to = best; render();
  } else if (t === "del" && q.mode === "client" && q.stage === "browse") {
    if (q.kind === "parcel") { if (best === q.from) { toast("Bu jo‘natma olinadigan joy"); return; } q.to = best; render(); }
    else { const s = STORES.find(x => x.kind === q.kind && x.node === best); if (s) { if (q.store !== s.id) q.cart = {}; q.store = s.id; q.stage = "store"; render(); } }
  } else if (t === "yuk" && S.yuk.stage === "form") {
    if (best === S.yuk.from) { toast("Bu yuk olinadigan joy"); return; }
    S.yuk.to = best; render();
  } else if (t === "bus") { S.bus.stop[S.bus.r] = best; render(); }
});

/* ================= Ishga tushirish ================= */
readTok();
new ResizeObserver(resize).observe(wrap);
const themeRefresh = () => { readTok(); buildStatic(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeRefresh);
new MutationObserver(themeRefresh).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (CW) buildStatic(); });
resize();
render();
setInterval(live, 250);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
